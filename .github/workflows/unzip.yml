name: Auto Unzip
on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Unzip file
        run: |
          echo "Đang tìm file zip..."
          ls -la
          # Tìm tất cả file zip và giải nén
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} -d . \;
          # Xóa các file zip sau khi giải nén xong
          find . -maxdepth 1 -name "*.zip" -exec rm {} \;
          
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-unzipped files" || echo "No changes to commit"
          git push
